<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cowork-flow 控制台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="title-block">
      <p class="eyebrow">只读工作流控制台</p>
      <h1>cowork-flow 看板</h1>
      <p id="summary">正在加载任务</p>
    </div>
    <nav id="viewSwitch" class="view-switch" aria-label="视图切换">
      <button type="button" data-view="board" class="active">任务看板</button>
      <button type="button" data-view="maintenance">数据库维护</button>
    </nav>
    <div id="boardControls" class="toolbar">
      <label class="search-field" for="search">
        <span>搜索任务</span>
        <input id="search" type="search" autocomplete="off" placeholder="标题 / ID / 负责人">
      </label>
      <label class="archive-toggle">
        <input id="showArchived" type="checkbox">
        <span>显示归档</span>
      </label>
      <button id="refresh" type="button" title="刷新任务数据">刷新</button>
    </div>
  </header>
  <nav id="statusFilters" class="status-tabs" aria-label="状态筛选">
    <button type="button" data-status="all" data-label="全部活跃" class="active">全部活跃</button>
    <button type="button" data-status="planning" data-label="规划中">规划中</button>
    <button type="button" data-status="in_progress" data-label="执行中">执行中</button>
    <button type="button" data-status="review" data-label="检查中">检查中</button>
    <button type="button" data-status="blocked" data-label="已阻塞">已阻塞</button>
    <button type="button" data-status="completed" data-label="已完成">已完成</button>
    <button type="button" data-status="archived" data-label="已归档">已归档</button>
  </nav>
  <div id="boardView" class="board-view">
    <main id="board" class="board" aria-live="polite"></main>
    <aside id="detail" class="detail" aria-live="polite" aria-label="任务详情">
      <div class="detail-empty">
        <h2>选择任务查看详情</h2>
        <p>任务基础信息、审计记录、子任务、代理运行和阻塞状态会显示在这里。</p>
      </div>
    </aside>
  </div>
  <main id="maintenanceView" class="maintenance-view" hidden aria-live="polite">
    <section class="maintenance-hero">
      <div>
        <p class="eyebrow">数据库维护</p>
        <h2>本项目运行库</h2>
        <p class="maintenance-copy">运行态数据、垃圾扫描和压缩操作集中在这里，任务看板保持干净。</p>
      </div>
      <button id="maintenanceRefresh" type="button">刷新概览</button>
    </section>
    <section class="maintenance-stats">
      <div id="maintenanceStats" class="maintenance-grid"></div>
      <div id="maintenanceCandidates" class="maintenance-candidates"></div>
    </section>
    <section class="maintenance-workbench">
      <div class="maintenance-section">
        <p class="eyebrow">清理预演</p>
        <h3>先扫描，再确认</h3>
        <div class="maintenance-actions">
          <label class="retention-field" for="retentionDays">
            <span>保留天数</span>
            <input id="retentionDays" type="number" min="0" value="30">
          </label>
          <button id="cleanupDryRun" type="button">扫描垃圾数据</button>
          <button id="cleanupConfirm" type="button" disabled>确认清理</button>
        </div>
      </div>
      <div class="maintenance-section">
        <p class="eyebrow">数据库压缩</p>
        <h3>WAL 与文件整理</h3>
        <div class="maintenance-actions">
          <button id="checkpointDb" type="button">Checkpoint</button>
          <button id="vacuumDb" type="button">VACUUM</button>
        </div>
      </div>
    </section>
    <section class="maintenance-output">
      <div>
        <p class="eyebrow">执行回显</p>
        <h3>维护预览</h3>
      </div>
      <pre id="maintenancePreview" class="maintenance-preview">尚未扫描</pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
