_base_: /tmp/SkillOpt/configs/_base_/default.yaml

model:
  backend: azure_openai
  optimizer: gpt-5.5
  target: gpt-5.5
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: xhigh
  azure_openai_endpoint: https://api.asxs.top/v1
  azure_openai_auth_mode: openai_compatible
  optimizer_azure_openai_endpoint: https://api.asxs.top/v1
  optimizer_azure_openai_auth_mode: openai_compatible
  target_azure_openai_endpoint: https://api.asxs.top/v1
  target_azure_openai_auth_mode: openai_compatible

train:
  num_epochs: 1
  train_size: 3
  batch_size: 3
  accumulation: 1

gradient:
  minibatch_size: 3
  merge_batch_size: 3
  analyst_workers: 2

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  use_slow_update: false
  use_meta_skill: false

evaluation:
  sel_env_num: 3
  test_env_num: 2
  eval_test: true

env:
  name: searchqa
  skill_init: /opt/projects/cowork-flow/.agent/skills/entry-boundary/SKILL.md
  split_mode: split_dir
  split_dir: /opt/projects/cowork-flow/.cowork-flow/tasks/archive/2026-05/05-31-skillopt-template-skill-optimization/skillopt-searchqa-split
  out_root: /tmp/SkillOpt/outputs/cowork-flow-entry-boundary
  max_turns: 1
  max_completion_tokens: 1024
  workers: 2
