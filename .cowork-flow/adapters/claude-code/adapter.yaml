schemaVersion: 1
host: claude-code
displayName: Claude Code
capabilities:
  dispatchSubagent: native
  freshChildContext: native
  sendFollowup: native
  waitChild: native
  listChildren: native
  cancelChild: native
  stateInjection: external
  backgroundChild: experimental
  runtimeContextDispatch: native
  runtimeContextBinding: shim
  runtimeContextCleanup: native
  spawnMultipleSubagents: native
  waitMultipleChildren: native
dispatch:
  primitive: subagent
  agentsPath: .claude/agents
  skillsPath: .claude/skills
  commandsPath: .claude/commands
  settingsPath: .claude/settings.json
  hooksPath: .claude/hooks
  memoryPath: CLAUDE.md
runtimeContext:
  transport: prompt
  promptKey: cowork_runtime_context_id
  envKey: COWORK_FLOW_RUNTIME_CONTEXT_ID
  metadataKey: cowork_runtime_context_id
contracts:
  entry: COWORK_ENTRY_CONTRACT_V1
  dispatch: RUNTIME_CONTEXT_DISPATCH_V2
  leafExecutor: true
fallback:
  whenRequiredCapabilityMissing: inline_or_manual
  whenRuntimeContextMissing: fail_closed
