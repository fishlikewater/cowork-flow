schemaVersion: 1
host: codex
displayName: Codex
capabilities:
  dispatchSubagent: native
  freshChildContext: native
  sendFollowup: native
  waitChild: native
  listChildren: native
  cancelChild: native
  stateInjection: native
  backgroundChild: native
  runtimeContextDispatch: native
  runtimeContextBinding: shim
  runtimeContextCleanup: native
dispatch:
  primitive: spawn_agent
  forkTurns: none
  followupPrimitive: assign_task
  waitPrimitive: wait_agent
  listPrimitive: list_agents
  cancelPrimitive: close_agent
  agentsPath: .codex/agents
runtimeContext:
  transport: prompt
  promptKey: cowork_runtime_context_id
  envKey: COWORK_FLOW_RUNTIME_CONTEXT_ID
  metadataKey: cowork_runtime_context_id
contracts:
  entry: COWORK_ENTRY_CONTRACT_V1
  dispatch: RUNTIME_CONTEXT_DISPATCH_V2
  leafExecutor: true
fallback:
  whenRequiredCapabilityMissing: inline_or_manual
  whenRuntimeContextMissing: fail_closed
