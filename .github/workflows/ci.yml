name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # The full release gate runs here so a pull request exercises exactly the
      # command publish.yml runs before npm publish. POSIX-only cases are
      # covered on this job. Its self-instance gates (drift, doctor) skip here:
      # a CI checkout has no .cowork-flow/ — it is gitignored — and those two
      # only mean something against a maintainer's working tree.
      - name: Run full release gate
        run: npm run release:check

      - name: Run Python repository tests
        run: |
          pip install "pytest>=8"
          python -m pytest -q

  windows-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run Windows core verification
        run: npm run test:windows:core

      - name: Run Python repository tests
        run: |
          pip install "pytest>=8"
          python -m pytest -q
