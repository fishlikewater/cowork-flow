name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The full release gate (node:full + template:full + pack:check) runs
      # here so a pull request exercises exactly the command publish.yml runs
      # before npm publish. POSIX-only cases are covered on this job.
      - name: Run full release gate
        run: npm run release:check

      - name: Run Python repository tests
        run: |
          pip install "pytest>=8"
          python -m pytest -q

  windows-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Windows core verification
        run: npm run test:windows:core

      - name: Run Python repository tests
        run: |
          pip install "pytest>=8"
          python -m pytest -q
