name: Publish npm Package

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing release tag to publish (for example v1.6.0)"
        required: true
        type: string

# A tag push and a Release published for the same tag both reach this workflow.
# Serialize per tag so the second run queues instead of racing the first onto
# npm; cancel-in-progress stays false so a queued run still gets its turn.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref || inputs.ref }}
  cancel-in-progress: false

jobs:
  verify-ubuntu:
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run Ubuntu full verification
        run: npm run release:check

  verify-windows:
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.ref != ''
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Run Windows full verification
        run: npm run release:check

  publish:
    needs: [verify-ubuntu, verify-windows]
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing exchanges a GitHub OIDC token for a short-lived npm
      # credential. Without id-token: write the runner never receives an ID token
      # to present, so the publish step falls back to whatever NPM_TOKEN holds —
      # and a classic token on a 2FA account fails with EOTP.
      id-token: write

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref || inputs.ref }}
          fetch-depth: 0

      - name: Verify release provenance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSHED_REF: ${{ github.ref }}
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            release_tag="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="${PUSHED_REF#refs/tags/}"
          else
            release_tag="${DISPATCH_REF#refs/tags/}"
          fi
          if [[ "$release_tag" != v* ]]; then
            echo "release ref must be an existing v-prefixed tag" >&2
            exit 1
          fi
          release_ref="refs/tags/$release_tag"
          if [[ "$release_ref" != refs/tags/v* ]]; then
            echo "release ref must resolve to refs/tags/v<version>" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v${package_version}" != "$release_tag" ]]; then
            echo "package version ${package_version} does not match release tag ${release_tag}" >&2
            exit 1
          fi
          template_version="$(tr -d '\r\n' < template/.cowork-flow/.version)"
          if [[ "$template_version" != "$package_version" ]]; then
            echo "template version ${template_version} does not match package version ${package_version}" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "release checkout is not clean" >&2
            git status --short >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "${release_ref}^{commit}")" ]]; then
            echo "checked out commit does not match ${release_tag}" >&2
            exit 1
          fi

      # The OIDC exchange behind Trusted Publishing landed in npm 11.5.1, which
      # Node 20 does not ship (it carries npm 10). Node 24 bundles a CLI that has
      # it. Only this job needs the newer runtime: the verify jobs stay on Node 20,
      # the version the package declares, so a release gate and the package agree.
      #
      # `registry-url` stays: npm needs the registry configured before it will
      # attempt the exchange at all, and without it the publish dies ENEEDAUTH
      # without ever contacting the token endpoint. What it writes — an
      # `${NODE_AUTH_TOKEN}` placeholder — is deliberately left unresolved. npm
      # tries the OIDC exchange with that empty credential in place and only
      # falls back to it if the exchange is refused; no token is ever supplied.
      - name: Setup Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install Node dependencies
        run: npm ci

      - name: Publish
        run: npm publish
