# The `cowork-flow` agent preset: the standard coding agent plus the
# cowork-flow workflow framework (task gate, planning, fixed subagents, skills).
#
# It started from the 0.1.x `standard` preset: the persona carries the
# cowork-flow operating rules, and `skill-filesystem` keeps the workspace
# default roots (`<projectRoot>/.dsh/skills` rank 100,
# `<projectRoot>/.agents/skills` rank 200) plus the user roots, so skills come
# from the project copy that `cwf project init` / `sync` delivers — this preset
# ships none of its own.
#
# The `dsh` host adapter lives in the cowork-flow repository
# (template/.cowork-flow/adapters/dsh/adapter.yaml) and declares this preset's
# capability model; this file is the DSH-side composition it describes.
#
# Version basis: the 0.1.x line. This file is what DSH 0.1.x reads as a preset
# directory (`$DSH_HOME/.agent-presets/<id>/`), and the 0.2.0 bundle is
# generated from it. Each delivered form must name only the packages its own
# line ships and carry only the config keys that line's schema accepts — either
# mistake makes that line fail the whole preset, not just the row. The lines
# disagree in two places: 0.1.x mounts `dsh-workflow-worker-thread`, which 0.2.0
# dropped for `dsh-workflow-ptc`, and this `dsh-persona` row is a single
# `text`, where 0.2.0 requires `prefix` (plus optional `suffix`). The bundle
# generator performs both rewrites, and a third: the hook specifier becomes a
# `file:` URL of the installed copy.
#
# Deliberate drift from the 0.1.x `standard` (0.1.2-rc.1), besides the
# cowork-flow persona and the `workflow-state-hook` row: `tool-subagent` drops
# `modelSelectionSettings`, the codex / claude-code rows use
# `enableRunInBackground: false` where the standard takes the `backgroundMode`
# default, `tool-web` sets `fetch: false`, and `command-goal` is not mounted.
# Rows the 0.2.0 `standard` adds over its 0.1.x counterpart (`present`,
# `tool-plugin-manager`) are absent from this preset on either line.

# ── identity ────────────────────────────────────────────────────────────────

# 0.1.x's persona schema: one `text`. 0.2.0 takes `prefix`/`suffix`, so the
# bundle moves this wording to `prefix` unchanged (see the header).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      你运行在 cowork-flow 流程框架上。项目已接入时，工作区 AGENTS.md 的"0.1 编码前强制门禁"生效：编辑文件、变更代码、派发子代理之前，先确定当前工作流状态（系统提示含 <workflow-state> 块则按其路由，否则运行 ./.cowork-flow/run task next），再决定放行、阻断还是路由；no_task / planning / completed 状态阻断写代码。只读问答、纯查询命令、用户明确说"跳过流程"时豁免。

      子代理身份由 runtime context 绑定决定，不由 prompt 推断：固定子代理（cowork-implement / cowork-check / cowork-research）按 agent-dispatch 技能执行 subagent bind / close，未绑定时禁止 start / resume / archive / commit / 派发 agent。

      项目流程以 task next、runtime gate、Skill command manifests 和 .cowork-flow/spec/ 硬契约为准；不要维护第二套流程文档或 Skill 注册控制面。文档语言中文；提交策略允许 AI 提交。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope.
# `skill-filesystem` discovers skills from the workspace's own roots
# (`<projectRoot>/.dsh/skills` at rank 100, `<projectRoot>/.agents/skills` at
# rank 200) plus the user roots, so cowork-flow skills come from the project
# copy that `init`/`sync` delivers — the preset ships none of its own.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── workflow state hook ────────────────────────────────────────────────────
# DSH-native equivalent of the Codex/Claude hooks: registers a system-prompt
# section (rendered last) that carries the `<workflow-state>` block, refreshed
# per user message. Consumes the host `systemPrompt` registry and publishes
# nothing, so it sits loose like the tool rows above.
- id: workflow-state-hook
  name: './plugins/workflow-state.js'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    # The 0.1.x row: 0.2.0 no longer ships this package and its `standard`
    # mounts `dsh-workflow-ptc` instead, so the generated bundle swaps the row.
    # This file itself is read by 0.1.x, where `ptc` resolves nowhere.
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
